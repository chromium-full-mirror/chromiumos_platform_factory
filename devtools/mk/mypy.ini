[mypy]
mypy_path = $MYPY_CONFIG_FILE_DIR/../../py_pkg/
exclude = (?x)(
    ; Paths that shouldn't be checked.
    /\S+\.venv/
    | ^py_pkg/
    | ^build/
    | ^py/experimental/
    | .*_pb2.py$
    | .*_pb2_grpc.py$
    | ^py/dome/backend/migrations/
    | ^py/test_list_editor/*
    ; Paths that is not ready to be checked.
    | ^doc/
    | ^go/src/overlord/
    | ^py/bundle_creator/
    | ^py/cli/test_list_insight.py
    | ^py/device/chromeos/display.py
    | ^py/external/chromeos_cli/flashrom.py
    | ^py/hwid/service/appengine/app.py
    | ^py/hwid/service/appengine/data/converter/converter.py
    | ^py/hwid/service/appengine/feature_matching.py
    | ^py/hwid/service/appengine/feature_matching_test.py
    | ^py/hwid/v2/yaml_datastore.py
    | ^py/instalog/lock_utils.py
    | ^py/instalog/plugins/output_socket.py
    | ^py/probe_info_service/app_engine/probe_tools/resources/runtime_probe_wrapper.py
    | ^py/test/event.py
    | ^py/test/pytests/keyboard_unittest.py
    | ^py/test/rf/e5071c_mock.py
    | ^py/test/rf/tcp_proxy.py
    | ^py/test/session_unittest.py
    | ^py/test/utils/drm_utils.py
    | ^py/tools/test_list_insight.py
    | ^py/umpire/server/daemon.py
    | ^py/umpire/server/daemon_unittest.py
    | ^py/umpire/server/download_slots_manager.py
    | ^py/umpire/server/rpc_cli_unittest.py
    | ^py/umpire/server/rpc_dut_unittest.py
    | ^py/umpire/server/service/umpire_service.py
    | ^py/umpire/server/service/umpire_service_unittest.py
    | ^py/utils/cros_board_utils.py
    | ^py/tools/disk_space.py
    | ^py/cli/disk_space.py
    | ^py/umpire/server/e2e_test/e2e_test.py
    | ^py/tools/ovl.py
    | ^py/cli/ovl.py
    | ^py/test/pytests/touch_device_fw_update.py
    | ^py/test/pytests/thermal_slope.py
    | ^py/test/pytests/thermal_load.py
    | ^py/test/utils/connection_manager_unittest.py
    | ^py/test/pytests/wireless_antenna.py
    | ^py/test/pytests/webgl_aquarium.py
    | ^py/test/pytests/update_psr_oem_data.py
    | ^py/test/pytests/update_cbi.py
    | ^py/test/pytests/suspend_stress.py
    | ^py/test/pytests/suspend_resume.py
    | ^py/test/pytests/removable_storage.py
    | ^py/test/pytests/plankton_charge.py
    | ^py/test/pytests/plankton_cc_flip_check.py
    | ^py/test/pytests/lid_switch.py
    | ^py/test/pytests/countdown.py
    | ^py/test/pytests/blocking_charge.py
    | ^py/test/pytests/finalize.py
    | ^py/goofy/goofy.py
    | ^py/cli/goofy.py
  )

warn_unused_configs = True
check_untyped_defs = True

; Remove following configs after we fix most errors.
; Ignore all errors caused by imported files.
follow_imports = silent
allow_untyped_globals = True

[mypy-google.api_core.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-google.cloud.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-google.auth.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-google.oauth2.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-grpc.*]
ignore_missing_imports = True

[mypy-jsonrpclib]
ignore_missing_imports = True

[mypy-packaging]
ignore_missing_imports = True

[mypy-spyne.*]
ignore_missing_imports = True

[mypy-twisted.*]
ignore_missing_imports = True

[mypy-txjsonrpc.*]
ignore_missing_imports = True

[mypy-zeep.*]
ignore_missing_imports = True
